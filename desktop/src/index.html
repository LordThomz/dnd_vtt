<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&amp;D Virtual Tabletop – Launcher</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="config.js"></script>
<script src="sfx.js"></script>
<script src="icons.js"></script>
<!--
  ══════════════════════════════════════════════════════════════════════════
  LAUNCHER – das Erste, was beim Start der App erscheint
  ══════════════════════════════════════════════════════════════════════════
  Läuft direkt in der App (nicht auf dem Server), damit er schon VOR dem
  Spiel aktualisieren kann.

  1. UPDATE (Pflicht): Prüft GitHub Releases. Gibt es eine neue Version, wird
     sie ohne Nachfrage geladen, installiert und die App neu gestartet.
     Ohne Internet startet die App trotzdem – beim Beitreten verhindert dann
     der Versionsvergleich, dass verschiedene Versionen zusammen spielen.
  2. VERWALTUNG (nur verwalten, nichts bearbeiten): Erweiterungen (an/aus,
     Übersicht, importieren, exportieren, entfernen), Würfel-Sets und Designs
     (ein-/ausblenden, importieren, exportieren). Grundlage: /api/packs und
     das Profil der Installation (/api/profile).
  3. SPIEL STARTEN: Alles Weitere – Kampagnen, Mitspielen bei einem DM,
     Charaktere, Bibliothek im Detail, Würfel-Werkstatt, Design-Studio –
     findet im Spiel statt. So gibt es jede Einstellung nur an einer Stelle.

  Ohne Tauri (im normalen Browser geöffnet) läuft alles außer dem Update –
  praktisch zum Testen.
  ══════════════════════════════════════════════════════════════════════════
-->
<style>
  @font-face { font-family: 'Cinzel'; font-weight: 700; src: url('fonts/cinzel-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Crimson Pro'; font-weight: 400; src: url('fonts/crimson-pro-latin-400-normal.woff2') format('woff2'); }
  :root {
    --gold: #d4b578; --gold-light: #f0d79c; --gold-dark: #8a6d35; --gold-rgb: 212,181,120;
    --arcane: #4de0d4; --arcane-rgb: 77,224,212; --violet: #9a7fe0;
    --bg-deep: #06070d; --bg-dark: #0c0e17; --bg-panel: #141725; --bg-panel2: #1b1f30;
    --border: #2a2c3e; --text: #dcd4c2; --text-dim: #7f7a8c; --text-bright: #f2ecda;
    --red: #e87070; --green: #6fd08f;
    --display: 'Cinzel', Georgia, serif; --body: 'Crimson Pro', Georgia, serif; --ui: 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--body); color: var(--text); background: var(--bg-deep); overflow: hidden;
    background-image:
      radial-gradient(ellipse 80% 55% at 50% -5%, rgba(77,224,212,.10) 0%, transparent 60%),
      radial-gradient(ellipse 50% 45% at 90% 100%, rgba(154,127,224,.10) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 5% 80%, rgba(212,181,120,.08) 0%, transparent 55%);
  }
  .stars { position: fixed; inset: 0; pointer-events: none; opacity: .55;
    background-image: radial-gradient(1px 1px at 12% 22%, #fff8, transparent), radial-gradient(1px 1px at 72% 12%, #fff6, transparent),
      radial-gradient(1px 1px at 42% 72%, #fff5, transparent), radial-gradient(1.5px 1.5px at 86% 52%, #fff7, transparent),
      radial-gradient(1px 1px at 22% 88%, #fff5, transparent), radial-gradient(1px 1px at 58% 38%, #fff4, transparent); }
  .wrap { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; }
  .crest { width: 74px; height: 74px; margin-bottom: 10px; filter: drop-shadow(0 0 18px rgba(212,181,120,.35)); }
  h1 { font: 700 2.3rem/1.1 var(--display); color: var(--gold); letter-spacing: .04em; text-align: center; text-shadow: 0 0 30px rgba(212,181,120,.35); }
  h1 .amp { color: var(--arcane); }
  .sub { font: 600 .74rem/1 var(--ui); letter-spacing: .32em; text-transform: uppercase; color: var(--arcane); margin: 10px 0 34px; text-align: center; }

  /* ── Update-Phase ───────────────────────────────────────────── */
  .stage { width: min(460px, 92vw); text-align: center; }
  .bar { height: 8px; margin: 18px 0 12px; border-radius: 6px; background: var(--bg-panel); border: 1px solid var(--border); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0%; border-radius: 6px; transition: width .3s ease;
    background: linear-gradient(90deg, #2a9d95, var(--arcane), var(--gold)); box-shadow: 0 0 14px rgba(77,224,212,.5); }
  .bar.indet i { width: 35%; animation: indet 1.2s ease-in-out infinite; }
  @keyframes indet { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
  .msg { color: var(--text-dim); font-size: 1rem; min-height: 1.4em; }
  .notes { margin-top: 14px; max-height: 140px; overflow: auto; text-align: left; font-size: .9rem; color: var(--text);
    padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,.03); border: 1px solid var(--border); white-space: pre-wrap; }

  /* ── Startseite: Verwaltungszentrale ─────────────────────────── */
  .wrap.compact { justify-content: flex-start; padding-top: 34px; }
  .wrap.compact .crest { width: 46px; height: 46px; margin-bottom: 4px; }
  .wrap.compact h1 { font-size: 1.6rem; }
  .wrap.compact .sub { margin: 6px 0 22px; }
  .home { width: min(1080px, 94vw); display: none; flex: 1; min-height: 0; flex-direction: column; }
  .home.show { display: flex; animation: rise .45s cubic-bezier(.2,1,.3,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .hero { display: flex; align-items: center; gap: 22px; padding: 20px 24px; border-radius: 16px;
    background: linear-gradient(120deg, rgba(212,181,120,.13), rgba(77,224,212,.06) 60%, rgba(154,127,224,.08));
    border: 1px solid rgba(var(--gold-rgb), .35); box-shadow: 0 20px 50px rgba(0,0,0,.45); }
  .hero-txt { flex: 1; }
  .hero-txt b { display: block; font: 700 1.15rem/1.2 var(--display); color: var(--gold-light); }
  .hero-txt span { color: var(--text-dim); }
  .btn-play { min-width: 230px; padding: 16px 26px; border-radius: 12px; border: none; cursor: pointer;
    font: 700 1rem/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: #17120a;
    background: linear-gradient(135deg, var(--gold-light), var(--gold) 45%, var(--gold-dark));
    box-shadow: 0 10px 30px rgba(var(--gold-rgb), .3); transition: filter .15s, transform .15s; }
  .btn-play:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-play:disabled { opacity: .45; cursor: default; }
  .status { display: inline-flex; align-items: center; gap: 7px; font: 600 .78rem/1 var(--ui); color: var(--text-dim); margin-top: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #e0b84d; box-shadow: 0 0 8px #e0b84d; animation: pulse 1.2s infinite; }
  .dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); animation: none; }
  .dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); animation: none; }
  @keyframes pulse { 50% { opacity: .35; } }

  .tabs { display: flex; gap: 4px; margin: 22px 0 0; border-bottom: 1px solid var(--border); }
  .tab { position: relative; padding: 12px 18px; background: none; border: none; cursor: pointer; color: var(--text-dim);
    font: 700 .8rem/1 var(--display); letter-spacing: .1em; text-transform: uppercase; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--gold-light); }
  .tab.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .tab .n { font: 600 .7rem/1 var(--ui); color: var(--text-dim); margin-left: 6px; }
  .panel { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 2px 60px; }
  .bar2 { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .bar2 p { flex: 1; color: var(--text-dim); font-size: .98rem; }
  .b { padding: 8px 15px; border-radius: 9px; cursor: pointer; background: transparent; border: 1px solid var(--border);
    color: var(--text); font: 700 .72rem/1 var(--display); letter-spacing: .06em; text-transform: uppercase; transition: all .15s; white-space: nowrap; }
  .b:hover:not(:disabled) { border-color: var(--gold); color: var(--gold-light); }
  .b:disabled { opacity: .35; cursor: default; }
  .b.gold { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #17120a; border-color: transparent; }
  .b.gold:hover { filter: brightness(1.1); color: #17120a; }
  .b.danger:hover { border-color: var(--red); color: var(--red); }

  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 14px;
    background: rgba(255,255,255,.025); border: 1px solid var(--border); transition: border-color .15s, opacity .2s; }
  .row:hover { border-color: rgba(var(--gold-rgb), .4); }
  .row.off { opacity: .5; }
  .row .ico { width: 46px; height: 46px; display: grid; place-items: center; font-size: 1.5rem; border-radius: 12px;
    background: rgba(255,255,255,.04); border: 1px solid var(--border); flex: 0 0 auto; }
  .row .info { flex: 1; min-width: 0; }
  .row .name { font: 700 1rem/1.25 var(--display); color: var(--text-bright); }
  .row .name small { font: 600 .7rem/1 var(--ui); color: var(--arcane); margin-left: 6px; letter-spacing: .04em; }
  .row .meta { font-size: .9rem; color: var(--text-dim); margin-top: 3px; }
  .row .acts { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font: 600 .65rem/1.5 var(--ui); letter-spacing: .05em;
    color: var(--gold); border: 1px solid rgba(var(--gold-rgb), .4); background: rgba(var(--gold-rgb), .08); margin-left: 6px; vertical-align: middle; }

  .sw { position: relative; width: 42px; height: 23px; cursor: pointer; flex: 0 0 auto; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; border-radius: 23px; background: var(--border); transition: background .2s; }
  .sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: var(--text-dim); transition: transform .2s, background .2s; }
  .sw input:checked + span { background: rgba(var(--gold-rgb), .45); }
  .sw input:checked + span::after { transform: translateX(19px); background: var(--gold-light); }
  .sw input:disabled + span { opacity: .4; cursor: default; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { position: relative; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.025); border: 1px solid var(--border); transition: opacity .2s, border-color .15s; }
  .card:hover { border-color: rgba(var(--gold-rgb), .4); }
  .card.off { opacity: .45; }
  .card .foot { display: flex; align-items: center; gap: 8px; padding: 10px 4px 2px; }
  .card .foot b { flex: 1; font: 700 .9rem/1.2 var(--display); color: var(--text-bright); }
  .card .acts2 { display: flex; gap: 6px; padding: 8px 4px 2px; }
  .card .acts2 .b { flex: 1; padding: 7px 4px; font-size: .64rem; letter-spacing: .04em; }
  .h3 { margin: 24px 0 10px; font: 700 .75rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  .h3:first-child { margin-top: 0; }
  .hint { color: var(--text-dim); font-size: .92rem; margin-top: 18px; padding: 10px 14px; border-left: 3px solid var(--arcane); background: rgba(var(--arcane-rgb), .05); border-radius: 0 8px 8px 0; }

  /* Fenster (Übersicht / Import) */
  .modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); backdrop-filter: blur(5px); }
  .modal.open { display: flex; }
  .mwin { width: min(720px, 92vw); max-height: 84vh; display: flex; flex-direction: column; border-radius: 16px;
    background: linear-gradient(180deg, var(--bg-panel2), var(--bg-dark)); border: 1px solid rgba(var(--gold-rgb), .35); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .mhead { display: flex; align-items: flex-start; gap: 12px; padding: 20px 24px 12px; }
  .mhead div { flex: 1; } .mhead h2 { font: 700 1.2rem/1.2 var(--display); color: var(--gold-light); }
  .mhead span { color: var(--text-dim); font-size: .92rem; }
  .x { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; }
  .mbody { padding: 4px 24px 22px; overflow-y: auto; }
  .ovcat { margin-top: 14px; } .ovcat h4 { font: 700 .72rem/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
  .ovlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
  .ovitem { padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.03); border: 1px solid var(--border); }
  .ovitem b { display: block; font-size: .95rem; color: var(--text-bright); font-weight: 600; }
  .ovitem i { display: block; font-style: normal; font-size: .82rem; color: var(--text-dim); margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chips span { padding: 4px 9px; border-radius: 20px; font-size: .82rem; background: rgba(255,255,255,.06); border: 1px solid var(--border); }
  .card img.thumb { display: block; width: 110px; height: 110px; margin: 2px auto 0; object-fit: contain; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
  .cat-prev { height: 132px; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px;
    background: radial-gradient(ellipse at 30% 20%, rgba(var(--arcane-rgb), .14), transparent 60%), linear-gradient(160deg, var(--bg-panel2), var(--bg-dark));
    border: 1px dashed rgba(var(--gold-rgb), .35); position: relative; }
  .cat-prev b { font: 700 1rem/1.2 var(--display); color: var(--gold-light); }
  .cat-prev span { font-size: .82rem; color: var(--text-dim); line-height: 1.3; }
  .cat-badge { position: absolute; top: 10px; left: 10px; font: 600 .62rem/1 var(--ui); letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 7px; border-radius: 10px; background: rgba(var(--arcane-rgb), .12); color: var(--arcane); border: 1px solid rgba(var(--arcane-rgb), .3); }
  /* ── Intro nach „Spiel starten" ── */
  .intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #030409; opacity: 0;
    transition: opacity .45s ease; cursor: pointer; overflow: hidden; }
  .intro.on { opacity: 1; }
  .intro .halo { position: absolute; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(212,181,120,.22), rgba(77,224,212,.08) 35%, transparent 65%); transform: scale(.4); opacity: 0;
    animation: halo 2.6s cubic-bezier(.2,.8,.2,1) .2s forwards; }
  @keyframes halo { 60% { opacity: 1; } to { transform: scale(1.15); opacity: .85; } }
  .intro .ring { position: absolute; width: 360px; height: 360px; animation: spin 18s linear infinite; opacity: 0; animation-delay: 0s; }
  .intro.on .ring { opacity: .9; transition: opacity 1.2s ease .3s; }
  .intro .ring2 { width: 440px; height: 440px; animation-duration: 28s; animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .intro .crest { position: relative; width: 170px; height: 170px; filter: drop-shadow(0 0 22px rgba(212,181,120,.65)); }
  .intro .crest path, .intro .crest polygon { fill: none; stroke: url(#ig); stroke-width: 2.2; stroke-linejoin: round;
    stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.3s cubic-bezier(.6,0,.2,1) forwards; }
  .intro .crest .l2 { animation-delay: .35s; stroke-width: 1.6; } .intro .crest .l3 { animation-delay: .6s; stroke-width: 1.2; opacity: .8; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .intro .ititle { position: absolute; top: calc(50% + 120px); font: 700 1.6rem/1 var(--display); color: var(--gold-light);
    letter-spacing: .6em; opacity: 0; animation: tin 1.1s ease 1.1s forwards; text-shadow: 0 0 24px rgba(212,181,120,.55); white-space: nowrap; }
  @keyframes tin { to { opacity: 1; letter-spacing: .14em; } }
  .intro .ibar { position: absolute; top: calc(50% + 170px); width: 260px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; }
  .intro .ibar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8a3a10, #e8a33d, #fff1c9);
    box-shadow: 0 0 12px #e8a33d; animation: fill 2.2s cubic-bezier(.4,0,.2,1) .3s forwards; }
  @keyframes fill { to { width: 100%; } }
  .intro .skip { position: absolute; bottom: 26px; font: 500 .72rem/1 var(--ui); letter-spacing: .1em; color: rgba(255,255,255,.3); }
  .intro.out { animation: iout .5s ease forwards; } @keyframes iout { to { filter: brightness(2.2) blur(6px); opacity: 0; } }
  /* ── Musikknopf ── */
  .music { position: fixed; top: 16px; right: 18px; z-index: 40; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 22px;
    background: rgba(12,14,23,.7); border: 1px solid var(--border); backdrop-filter: blur(6px); }
  .music button { width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent; color: var(--gold); cursor: pointer; display: grid; place-items: center; }
  .music button svg { width: 17px; height: 17px; }
  .music input { width: 0; opacity: 0; transition: width .25s, opacity .25s; accent-color: var(--gold); }
  .music:hover input { width: 90px; opacity: 1; }
  /* ── Platzhalter & Staffelung ── */
  .skel { height: 74px; border-radius: 14px; margin-bottom: 10px; background: linear-gradient(90deg, rgba(255,255,255,.03) 25%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.03) 75%);
    background-size: 300% 100%; animation: shim 1.4s ease-in-out infinite; } @keyframes shim { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .rows > *, .grid > * { animation: rise2 .45s cubic-bezier(.2,.8,.2,1) both; }
  .rows > *:nth-child(2), .grid > *:nth-child(2) { animation-delay: .05s; } .rows > *:nth-child(3), .grid > *:nth-child(3) { animation-delay: .1s; }
  .rows > *:nth-child(4), .grid > *:nth-child(4) { animation-delay: .15s; } .rows > *:nth-child(n+5), .grid > *:nth-child(n+5) { animation-delay: .2s; }
  @keyframes rise2 { from { opacity: 0; transform: translateY(10px); } }
  .panel { animation: rise2 .35s ease both; }
  svg.ic { width: 1.1em; height: 1.1em; vertical-align: -.17em; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; transition: all .25s; z-index: 60;
    padding: 11px 18px; border-radius: 10px; background: var(--bg-panel2); border: 1px solid rgba(var(--gold-rgb), .45); color: var(--text-bright); font: 500 .9rem/1.3 var(--ui); }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  @media (max-width: 760px) { .hero { flex-direction: column; align-items: stretch; } h1 { font-size: 1.8rem; } }
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">
  <img class="crest" src="favicon.svg" alt="">
  <h1>D<span class="amp">&amp;</span>D Virtual Tabletop</h1>
  <div class="sub">Pen &amp; Paper · Launcher</div>

  <!-- Phase 1: Update -->
  <div class="stage" id="stage">
    <div class="bar indet" id="bar"><i></i></div>
    <div class="msg" id="msg">Suche nach Updates …</div>
    <div class="notes" id="notes" style="display:none"></div>
    <div class="err" id="stage-err"></div>
    <div id="stage-actions" style="display:none">
      <button class="btn" onclick="runUpdate()">Erneut versuchen</button>
      <button class="btn alt" onclick="skipUpdate()">Ohne Update starten</button>
    </div>
  </div>

  <!-- Phase 2: Verwaltungszentrale -->
  <div class="home" id="home">
    <div class="hero">
      <div class="hero-txt">
        <b>Bereit für das nächste Abenteuer?</b>
        <span>Kampagnen leiten, bei Freunden mitspielen, Charaktere und Würfel gestalten – alles im Spiel.</span>
        <div><span class="status"><span class="dot" id="srv-dot"></span><span id="srv-text">Wird vorbereitet …</span></span></div>
      </div>
      <button class="btn-play" id="btn-play" disabled onclick="startGame()">Spiel starten</button>
    </div>

    <nav class="tabs">
      <button class="tab on" data-tab="packs">📚 Erweiterungen<span class="n" id="n-packs"></span></button>
      <button class="tab" data-tab="dice">🎲 Würfel-Sets<span class="n" id="n-dice"></span></button>
      <button class="tab" data-tab="designs">🎨 Designs<span class="n" id="n-designs"></span></button>
    </nav>
    <div class="panel" id="panel"><p class="msg">Wird geladen …</p></div>
  </div>
</div>
<div class="foot">Version <b id="ver">–</b> <span id="upd-state"></span></div>
<div class="modal" id="modal"><div class="mwin"><div class="mhead"><div><h2 id="m-title"></h2><span id="m-sub"></span></div>
  <button class="x" onclick="closeModal()">✕</button></div><div class="mbody" id="m-body"></div></div></div>
<div class="toast" id="toast"></div>
<div class="music" id="music" title="Musik"><button id="music-btn" onclick="toggleMusic()" aria-label="Musik an/aus"></button>
  <input type="range" id="music-vol" min="0" max="100" oninput="musicVolume(this.value)"></div>
<div class="intro" id="intro" style="display:none" onclick="finishIntro()">
  <div class="halo"></div>
  <svg class="ring" viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="none" stroke="rgba(212,181,120,.35)" stroke-width=".6" stroke-dasharray="2 6"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(77,224,212,.28)" stroke-width=".4"/>

  <svg class="ring ring2" viewBox="0 0 200 200"><circle cx="100" cy="100" r="97" fill="none" stroke="rgba(154,127,224,.25)" stroke-width=".5" stroke-dasharray="14 4 2 4"/></svg>
  <svg class="crest" viewBox="0 0 100 100"><defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1c9"/><stop offset=".5" stop-color="#d4b578"/><stop offset="1" stop-color="#4de0d4"/></linearGradient></defs>
    <polygon points="50,4 91,27 91,73 50,96 9,73 9,27"/><polygon class="l2" points="50,22 76,66 24,66"/>
    <path class="l3" d="M50 4 50 22 M91 27 76 66 M9 27 24 66 M91 73 76 66 M9 73 24 66 M50 96 50 66 M50 22 9 27 M50 22 91 27"/></svg>
  <div class="ititle">D&amp;D VIRTUAL TABLETOP</div>
  <div class="ibar"><i></i></div>
  <div class="skip">Klicken zum Überspringen</div>
</div>
<input type="file" id="file-in" accept=".vttpack,.vttdice,.zip,.json" hidden>

<script>
"use strict";
const T = window.__TAURI__;
const LOCAL = "http://localhost:5000";          // eigener Server (Sidecar)
const PORT = 5000;                               // Standard-Port eines DM
const $ = id => document.getElementById(id);
let myVersion = "dev", serverReady = false;

// ── Hilfen ────────────────────────────────────────────────────────────────
function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("Zeitüberschreitung")), ms))]);
}
async function getJSON(url, ms) {
  const res = await withTimeout(fetch(url, { cache: "no-store" }), ms || 5000);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
function setMsg(t) { $("msg").textContent = t; }
function setBar(pct) {
  const b = $("bar");
  if (pct == null) { b.classList.add("indet"); b.firstElementChild.style.width = ""; return; }
  b.classList.remove("indet"); b.firstElementChild.style.width = Math.max(2, Math.min(100, pct)) + "%";
}
function showErr(id, text) { const e = $(id); e.textContent = text; e.classList.toggle("show", !!text); }
function launcherUrl() { return location.href.split("#")[0]; }

// ── 1) UPDATE – Pflicht, ohne Nachfrage ───────────────────────────────────
async function runUpdate() {
  $("stage-actions").style.display = "none"; showErr("stage-err", "");
  setBar(null); setMsg("Suche nach Updates …");
  if (!T || !T.updater) { $("upd-state").textContent = "· Update-Prüfung nur in der App"; return showHome(); }
  let upd = null;
  try {
    upd = await withTimeout(T.updater.check(), 15000);
  } catch (e) {
    // Keine Verbindung zu GitHub: trotzdem spielen lassen. Beim Beitreten
    // sorgt der Versionsvergleich dafür, dass nur gleiche Versionen spielen.
    $("upd-state").textContent = "· Update-Prüfung nicht möglich (offline?)";
    return showHome();
  }
  if (!upd) { $("upd-state").textContent = "· aktuell"; return showHome(); }

  setMsg(`Version ${upd.version} wird installiert …`);
  if (upd.body) { $("notes").textContent = upd.body; $("notes").style.display = "block"; }
  try {
    // Den eigenen Server vorher beenden – sonst kann Windows seine Datei
    // beim Installieren nicht ersetzen.
    try { await T.core.invoke("stop_server"); } catch (e) {}
    let total = 0, got = 0;
    await upd.downloadAndInstall(ev => {
      if (ev.event === "Started") { total = ev.data.contentLength || 0; setBar(total ? 0 : null); }
      else if (ev.event === "Progress") {
        got += ev.data.chunkLength || 0;
        if (total) { setBar(got / total * 100); setMsg(`Lade Version ${upd.version} … ${Math.round(got / total * 100)} %`); }
      } else if (ev.event === "Finished") { setBar(100); setMsg("Installiere …"); }
    });
    setMsg("Neustart …");
    await T.process.relaunch();
  } catch (e) {
    setBar(0); setMsg("Das Update konnte nicht installiert werden.");
    showErr("stage-err", String(e && e.message || e));
    $("stage-actions").style.display = "block";
  }
}
function skipUpdate() { $("upd-state").textContent = "· Update ausstehend"; showHome(); }

// ── 2) VERWALTUNGSZENTRALE ────────────────────────────────────────────────
//  Hier wird nur VERWALTET (an/aus, importieren, exportieren, entfernen).
//  Spielen, Bearbeiten, Verbinden und Design-Wahl passieren im Spiel.
const API = (path, opts) => fetch(LOCAL + path, Object.assign({ cache: "no-store" }, opts || {}, {
  headers: Object.assign({ "X-VTT-App": "1" }, (opts && opts.headers) || {}) }));
async function apiJSON(path, opts) {
  const r = await API(path, opts);
  let d = null; try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((d && d.error) || ("Fehler " + r.status));
  return d;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
let toastT = 0;
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 3200); }
function closeModal() { $("modal").classList.remove("open"); }
function openModal(title, sub, body) { $("m-title").textContent = title; $("m-sub").textContent = sub || ""; $("m-body").innerHTML = body; $("modal").classList.add("open"); }

const CAT = { races: "Rassen", classes: "Klassen", subclasses: "Unterklassen", backgrounds: "Hintergründe", feats: "Talente",
  spells: "Zauber", items: "Gegenstände", magic_items: "Magische Gegenstände", attacks: "Angriffe", conditions: "Zustände", monsters: "Monster" };
const countsText = c => Object.entries(c || {}).filter(([, n]) => n).map(([k, n]) => `${n} ${CAT[k] || k}`).join(" · ") || "leer";

let tab = "packs", packs = [], profile = { keys: {} };

function showHome() {
  $("stage").style.display = "none";
  renderMusicBtn();
  try { Sfx.music.start(); } catch (e) {}
  $("panel").innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  document.querySelector(".wrap").classList.add("compact");
  $("home").classList.add("show");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; renderTabs(); render(); });
  waitForOwnServer(0);
}

async function waitForOwnServer(attempt) {
  try {
    const info = await getJSON(LOCAL + "/api/server/info", 1500);
    serverReady = true;
    $("srv-dot").className = "dot ok"; $("srv-text").textContent = "Alles bereit";
    $("btn-play").disabled = false;
    if (info.version && myVersion === "dev") $("ver").textContent = info.version;
    // Design-Dateien des Spiels laden → Vorschauen zeigen das ECHTE Aussehen
    ["themes.css", "design-studio.css", "fx.css"].forEach(f => {
      const l = document.createElement("link"); l.rel = "stylesheet"; l.href = LOCAL + "/static/css/" + f;
      document.head.appendChild(l);
    });
    await new Promise(res => { const sc = document.createElement("script"); sc.src = LOCAL + "/static/js/design-runtime.js";
      sc.onload = res; sc.onerror = res; document.head.appendChild(sc); });
    await reload();
    // Klang-Einstellungen aus dem Profil übernehmen (gleich wie im Spiel)
    try { const fx = JSON.parse((profile.keys || {}).vtt_fx || "null"); if (fx) { Sfx.configure(fx); renderMusicBtn(); if (fx.music) Sfx.music.start(); } } catch (e) {}
    const fxs = document.createElement("script"); fxs.src = LOCAL + "/static/js/fx.js"; document.head.appendChild(fxs);
    return;
  } catch (e) {}
  if (attempt > 120) { $("srv-dot").className = "dot err"; $("srv-text").textContent = "Dein Server startet nicht – App bitte neu starten"; return; }
  setTimeout(() => waitForOwnServer(attempt + 1), 500);
}

async function reload() {
  try { packs = await apiJSON("/api/packs"); } catch (e) { packs = []; }
  try { profile = await apiJSON("/api/profile"); } catch (e) { profile = { keys: {} }; }
  renderTabs(); render();
}
function renderTabs() {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("n-packs").textContent = packs.filter(p => p.total).length || "";
  $("n-dice").textContent = diceStore().sets.length || "";
  $("n-designs").textContent = (2 + designsInstalled().length) || "";
}
function render() { $("panel").innerHTML = { packs: renderPacks, dice: renderDice, designs: renderDesigns }[tab](); }

// ── Intro: Vorfreude statt hartem Umschalten ───────────────────────────────
let introDone = false, introTimer = 0;
function startGame() {
  const target = LOCAL + "/menu#vttprofile=" + packHandover({ launcher: launcherUrl(), intro: 1 });
  const ov = $("intro"); ov.style.display = "grid"; requestAnimationFrame(() => ov.classList.add("on"));
  window._introTarget = target;
  try { Sfx.music.stop(1.5); Sfx.play("intro"); } catch (e) {}
  fetch(LOCAL + "/menu", { cache: "force-cache" }).catch(() => {});        // vorladen
  introTimer = setTimeout(finishIntro, 2700);
}
function finishIntro() {
  if (introDone) return; introDone = true; clearTimeout(introTimer);
  $("intro").classList.add("out");
  setTimeout(() => { location.href = window._introTarget; }, 420);
}

// ── Musik (generativ, sfx.js) ──────────────────────────────────────────────
function fxSettings() {
  try { const p = JSON.parse((profile.keys || {}).vtt_fx || "null"); if (p) return Object.assign(Sfx.settings(), p); } catch (e) {}
  return Sfx.settings();
}
function renderMusicBtn() {
  const s = Sfx.settings();
  $("music-btn").innerHTML = Icons.svg(s.music ? "music" : "volume-x");
  $("music-vol").value = Math.round(s.musicVol * 100);
}
async function persistFx() {
  try { if (serverReady) await saveProfileKeys({ vtt_fx: JSON.stringify(Sfx.settings()) }); } catch (e) {}
}
function toggleMusic() {
  const on = !Sfx.settings().music;
  Sfx.configure({ music: on }); if (on) Sfx.music.start();
  renderMusicBtn(); persistFx();
}
let volT = 0;
function musicVolume(v) { Sfx.configure({ musicVol: v / 100 }); clearTimeout(volT); volT = setTimeout(persistFx, 500); }

// ── Eigener Bestätigungsdialog (statt Windows-Fenster) ────────────────────
function askConfirm(title, text, okText) {
  return new Promise(res => {
    openModal(title, "", `<p style="color:var(--text);font-size:1rem">${esc(text)}</p>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px">
        <button class="b" id="cf-no">Abbrechen</button><button class="b danger" id="cf-yes" style="border-color:var(--red);color:var(--red)">${esc(okText || "OK")}</button></div>`);
    $("cf-no").onclick = () => { closeModal(); res(false); };
    $("cf-yes").onclick = () => { closeModal(); res(true); };
  });
}

// Datei speichern: App → Download-Ordner, Browser → Download
async function saveFile(name, bytes, mime) {
  if (T && T.fs && T.path) {
    const dir = await T.path.downloadDir();
    await T.fs.writeFile(await T.path.join(dir, name), bytes);
    try { T.shell && T.shell.open && await T.shell.open(dir); } catch (e) {}
    return toast("Im Download-Ordner gespeichert: " + name);
  }
  const url = URL.createObjectURL(new Blob([bytes], { type: mime || "application/octet-stream" }));
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Exportiert: " + name);
}
function pickFile(accept) {
  return new Promise(res => {
    const inp = $("file-in"); inp.value = ""; inp.accept = accept;
    inp.onchange = () => res(inp.files[0] || null); inp.click();
  });
}

// ── Erweiterungen ─────────────────────────────────────────────────────────
function renderPacks() {
  const rows = packs.filter(p => p.total || !p.builtin).map(p => `
    <div class="row${p.enabled ? "" : " off"}">
      <div class="ico">${p.id === "basis" ? "📘" : p.id === "eigene" ? "✍️" : "📦"}</div>
      <div class="info"><div class="name">${esc(p.name)}${p.version ? `<small>v${esc(p.version)}</small>` : ""}${p.builtin ? `<span class="tag">Eingebaut</span>` : ""}</div>
        <div class="meta">${p.author ? "von " + esc(p.author) + " · " : ""}${esc(countsText(p.counts))}</div></div>
      <div class="acts">
        <button class="b" onclick="packOverview('${esc(p.id)}')">Übersicht</button>
        <button class="b" onclick="packExport('${esc(p.id)}')" ${p.total ? "" : "disabled"}>Exportieren</button>
        ${p.builtin ? "" : `<button class="b danger" onclick="packRemove('${esc(p.id)}')">Entfernen</button>`}
        <label class="sw" title="${p.enabled ? "Aktiv – im Spiel verfügbar" : "Deaktiviert"}"><input type="checkbox" ${p.enabled ? "checked" : ""} onchange="packToggle('${esc(p.id)}', this.checked)"><span></span></label>
      </div></div>`).join("");
  return `<div class="bar2"><p>Erweiterungen bringen Rassen, Klassen, Unterklassen und mehr ins Spiel. Deaktivierte bleiben gespeichert, stehen im Spiel aber nicht zur Auswahl.</p>
    <button class="b gold" onclick="packImport()">Importieren</button></div><div class="rows">${rows}</div>
    <div class="hint">Die Inhalte im Detail ansehen und eigene Inhalte erstellen kannst du im Spiel in der <b>Bibliothek</b>.</div>`;
}
async function packToggle(id, on) {
  try { await apiJSON(`/api/packs/${encodeURIComponent(id)}/enabled`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: on }) }); await reload(); }
  catch (e) { toast("⚠️ " + e.message); }
}
async function packOverview(id) {
  const p = packs.find(x => x.id === id) || {};
  let c = {}; try { c = await apiJSON(`/api/packs/${encodeURIComponent(id)}/contents`); } catch (e) {}
  const body = (p.description ? `<p style="color:var(--text-dim);margin-bottom:6px">${esc(p.description)}</p>` : "") +
    (Object.keys(c).length ? Object.entries(c).map(([cat, items]) => `<div class="ovcat"><h4>${esc(CAT[cat] || cat)} · ${items.length}</h4><div class="ovlist">` +
      items.map(it => `<div class="ovitem"><b>${esc(it.name)}</b>${it.parent ? `<i>${esc(it.parent)}</i>` : it.description ? `<i>${esc(it.description.slice(0, 80))}${it.description.length > 80 ? " …" : ""}</i>` : ""}</div>`).join("") + `</div></div>`).join("")
      : `<p style="color:var(--text-dim)">Diese Erweiterung ist leer.</p>`);
  openModal(p.name || id, [p.version ? "v" + p.version : "", p.author ? "von " + p.author : ""].filter(Boolean).join(" · "), body);
}
async function packExport(id) {
  const p = packs.find(x => x.id === id) || {};
  try {
    const r = await API("/api/packs/export", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: p.builtin ? "" : id, name: p.builtin ? (id === "eigene" ? "Meine Inhalte" : "Grundregeln") : p.name,
                             version: p.version || "1.0.0", description: p.description || "", sources: [id] }) });
    if (!r.ok) throw new Error((await r.json()).error);
    const name = ((r.headers.get("Content-Disposition") || "").match(/filename="([^"]+)"/) || [])[1] || "erweiterung.vttpack";
    await saveFile(name, new Uint8Array(await r.arrayBuffer()), "application/zip");
  } catch (e) { toast("⚠️ " + e.message); }
}
async function packRemove(id) {
  const p = packs.find(x => x.id === id) || {};
  if (!await askConfirm("Erweiterung entfernen", `„${p.name}" und alle ${p.total} Einträge daraus entfernen?`, "Entfernen")) return;
  try { await apiJSON("/api/packs/" + encodeURIComponent(id), { method: "DELETE" }); toast("Erweiterung entfernt"); await reload(); }
  catch (e) { toast("⚠️ " + e.message); }
}
async function packImport() {
  const f = await pickFile(".vttpack,.zip"); if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  let pv; try { pv = await apiJSON("/api/packs/preview", { method: "POST", body: fd }); } catch (e) { return toast("⚠️ " + e.message); }
  window._pendingPack = f;
  openModal((pv.is_update ? "Aktualisieren: " : "Installieren: ") + pv.pack.name,
    [pv.pack.version ? "v" + pv.pack.version : "", pv.pack.author ? "von " + pv.pack.author : ""].filter(Boolean).join(" · "),
    (pv.pack.description ? `<p style="color:var(--text-dim)">${esc(pv.pack.description)}</p>` : "") +
    `<div class="chips">${Object.entries(pv.counts).map(([c, n]) => `<span>${n} ${esc(CAT[c] || c)}</span>`).join("")}${pv.dice_sets ? `<span>${pv.dice_sets} Würfel-Sets</span>` : ""}</div>` +
    (pv.is_update ? `<div class="hint" style="border-left-color:var(--gold)">Bereits installiert (v${esc(pv.installed_version)}). Die Einträge dieser Erweiterung werden ersetzt.</div>` : "") +
    `<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button class="b" onclick="closeModal()">Abbrechen</button><button class="b gold" onclick="packDoImport()">${pv.is_update ? "Aktualisieren" : "Installieren"}</button></div>`);
}
async function packDoImport() {
  const fd = new FormData(); fd.append("file", window._pendingPack);
  try {
    const r = await apiJSON("/api/packs/import", { method: "POST", body: fd });
    const nd = (r.dice || []).length ? await addDiceSets(r.dice) : 0;
    closeModal(); toast(`„${r.pack.name}" installiert: ${r.added} Einträge${nd ? `, ${nd} Würfel-Sets` : ""}`);
    await reload();
  } catch (e) { toast("⚠️ " + e.message); }
}

// ── Würfel-Sets (liegen im Profil der Installation) ──────────────────────
function diceStore() {
  try { const d = JSON.parse((profile.keys || {}).vtt_dice_sets || "null"); if (d && Array.isArray(d.sets)) return d; } catch (e) {}
  return { sets: [], activeId: null };
}
async function saveProfileKeys(patch) {
  const keys = Object.assign({}, profile.keys || {}, patch);
  await apiJSON("/api/profile", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ keys }) });
  profile.keys = keys;
}
async function saveDice(store) { await saveProfileKeys({ vtt_dice_sets: JSON.stringify(store) }); renderTabs(); render(); }
async function addDiceSets(list) {
  const st = diceStore(); let n = 0;
  (list || []).forEach(s => { if (!s || typeof s.dice !== "object") return;
    const c = JSON.parse(JSON.stringify(s)); c.id = "set_" + Math.random().toString(36).slice(2, 10); delete c.presetId; delete c.hidden;
    c.name = String(c.name || "Importiertes Set").slice(0, 60); st.sets.push(c); n++; });
  if (!st.activeId && st.sets.length) st.activeId = st.sets[0].id;
  await saveDice(st); return n;
}
function dieMini(st) {
  st = st || {};
  const edge = st.edges && st.edges !== "none" ? (st.edgeColor || "#fff") : "rgba(0,0,0,.35)";
  const cls = /glass|crystal/.test(st.surface || "") ? " glass" : st.surface === "metal" ? " metal" : "";
  return `<div class="ds-die${cls}" style="--c1:${esc(st.color || "#c8a24a")};--c2:${esc(st.color2 || st.color || "#c8a24a")};--edge:${esc(edge)};--num:${esc(st.numberColor || "#111")}">
    <svg viewBox="0 0 100 100"><polygon class="o" points="50,4 91,27 91,73 50,96 9,73 9,27"/><polygon class="f" points="50,20 78,66 22,66"/>
    <line class="l" x1="50" y1="4" x2="50" y2="20"/><line class="l" x1="91" y1="27" x2="78" y2="66"/><line class="l" x1="9" y1="27" x2="22" y2="66"/>
    <line class="l" x1="50" y1="96" x2="50" y2="66"/><line class="l" x1="50" y1="20" x2="9" y2="27"/><line class="l" x1="50" y1="20" x2="91" y2="27"/></svg>
    <span ${st.font ? `style="font-family:${esc(st.font)}"` : ""}>20</span></div>`;
}
function renderDice() {
  const st = diceStore();
  const cards = st.sets.map(s => { const active = s.id === st.activeId; return `
    <div class="card${s.hidden && !active ? " off" : ""}">
      ${s.thumb && /^data:image\/(webp|png|jpeg);base64,/.test(s.thumb) ? `<img class="thumb" src="${s.thumb}" alt="">` : dieMini((s.dice || {})[20] || (s.dice || {})["20"])}
      <div class="foot"><b>${esc(s.name || "Set")}</b>${active ? `<span class="tag">Aktiv</span>` : ""}
        <label class="sw" title="${active ? "Das aktive Set ist immer sichtbar" : s.hidden ? "Ausgeblendet" : "Im Spiel zur Auswahl"}"><input type="checkbox" ${!s.hidden || active ? "checked" : ""} ${active ? "disabled" : ""} onchange="diceToggle('${esc(s.id)}', this.checked)"><span></span></label></div>
      <div class="acts2"><button class="b" onclick="diceExport('${esc(s.id)}')">Exportieren</button>
        <button class="b danger" onclick="diceDelete('${esc(s.id)}')" ${active || st.sets.length < 2 ? "disabled" : ""}>Löschen</button></div>
    </div>`; }).join("");
  return `<div class="bar2"><p>Deine Würfel-Sets. Ausgeblendete stehen im Spiel nicht zur Auswahl. Gestaltet und ausgewählt wird im Spiel.</p>
    <button class="b gold" onclick="diceImport()">Importieren</button></div>
    ${st.sets.length ? `<div class="grid">${cards}</div>` : `<p class="msg">Noch keine eigenen Sets – sie entstehen in der Würfel-Werkstatt im Spiel.</p>`}`;
}
async function diceToggle(id, on) { const st = diceStore(); const s = st.sets.find(x => x.id === id); if (s) { if (on) delete s.hidden; else s.hidden = true; } await saveDice(st); }
async function diceDelete(id) {
  const st = diceStore(); const s = st.sets.find(x => x.id === id); if (!s) return;
  if (!await askConfirm("Würfel-Set löschen", `„${s.name}" wird gelöscht.`, "Löschen")) return;
  st.sets = st.sets.filter(x => x.id !== id); await saveDice(st); toast("Set gelöscht");
}
async function diceExport(id) {
  const s = diceStore().sets.find(x => x.id === id); if (!s) return;
  const c = JSON.parse(JSON.stringify(s)); delete c.hidden;
  const name = (String(s.name || "wuerfel").replace(/[^\wäöüÄÖÜß -]+/g, "").trim() || "wuerfel") + ".vttdice";
  await saveFile(name, new TextEncoder().encode(JSON.stringify({ vttdice: 1, set: c }, null, 1)), "application/json");
}
async function diceImport() {
  const f = await pickFile(".vttdice,.json,.vttpack"); if (!f) return;
  if (/\.vttpack$/i.test(f.name)) { window._pendingPack = f; tab = "packs"; renderTabs(); render(); return packImportFile(f); }
  try {
    const d = JSON.parse(await f.text());
    const list = d.vttdice ? [d.set] : Array.isArray(d.sets) ? d.sets : [];
    if (!list.length) throw new Error("Das ist keine Würfel-Set-Datei (.vttdice)");
    const n = await addDiceSets(list); toast(`${n} Würfel-Set${n > 1 ? "s" : ""} importiert`);
  } catch (e) { toast("⚠️ " + e.message); }
}
async function packImportFile(f) { const orig = pickFile; pickFile = async () => f; try { await packImport(); } finally { pickFile = orig; } }

// ── Designs ───────────────────────────────────────────────────────────────
//  Eingebaut ist nur je ein Standard-Design. Weitere kommen aus dem Katalog
//  (GitHub: designs/index.json), aus dem Design-Editor im Spiel oder per
//  Import (.vttdesign). Alle liegen im Profil (vtt_designs).
const BUILTIN = { ui: [{ id: "arkanum", name: "Arkanum", tag: "Standard" }], table: [{ id: "arkan", name: "Arkaner Tisch", tag: "Standard" }] };
let catalog = null, catalogErr = "";
function catalogBase() {
  if (window.VTT_CATALOG_URL) return window.VTT_CATALOG_URL.replace(/\/?$/, "/");
  if (!window.VTT_REPO || /GITHUB-NUTZER/.test(window.VTT_REPO)) return "";
  return `https://raw.githubusercontent.com/${window.VTT_REPO}/main/designs/`;
}
async function loadCatalog() {
  const base = catalogBase();
  if (!base) { catalogErr = "Der Design-Katalog ist noch nicht eingerichtet."; catalog = []; return; }
  try { const d = await getJSON(base + "index.json", 8000); catalog = (d && d.designs) || []; catalogErr = ""; }
  catch (e) { catalog = []; catalogErr = "Katalog nicht erreichbar – keine Internetverbindung?"; }
}
function designsInstalled() {
  try { const l = JSON.parse((profile.keys || {}).vtt_designs || "[]"); return Array.isArray(l) ? l : []; } catch (e) { return []; }
}
function hiddenDesigns() { try { return new Set(JSON.parse((profile.keys || {}).vtt_hidden_designs || "[]")); } catch (e) { return new Set(); } }
function injectDesignCSS(list) {
  if (typeof DesignRuntime === "undefined") return;
  let el = $("launcher-designs"); if (!el) { el = document.createElement("style"); el.id = "launcher-designs"; document.head.appendChild(el); }
  el.textContent = list.map(d => DesignRuntime.css(d)).join("\n");
}
function uiMini(id) { return `<div class="ds-ui" data-ui-theme="${esc(id)}"><div class="ds-ui-bar"><span class="ds-ui-dot"></span><span class="ds-ui-title">Abenteuer</span></div>
  <div class="ds-ui-body"><div class="ds-ui-panel"><div class="ds-ui-h">Initiative</div><div class="ds-ui-row"><i></i><span>Thorin</span><b>18</b></div><div class="ds-ui-row dim"><i></i><span>Goblin</span><b>12</b></div></div>
  <div class="ds-ui-side"><div class="ds-ui-btn">Würfeln</div><div class="ds-ui-chip">W20 · 17</div></div></div></div>`; }
function tableMini(id) { return `<div class="ds-table" data-table-theme="${esc(id)}"><div class="ds-table-grid"></div><div class="ds-token" style="left:30%;top:38%"></div><div class="ds-token b" style="left:62%;top:58%"></div></div>`; }
const miniFor = (scope, id) => scope === "ui" ? uiMini(id) : tableMini(id);

function renderDesigns() {
  if (catalog === null) { loadCatalog().then(() => tab === "designs" && render()); }
  const inst = designsInstalled(), h = hiddenDesigns(), k = profile.keys || {};
  const cur = { ui: k.vtt_theme_ui || "arkanum", table: k.vtt_theme_table || "arkan" };
  const catById = Object.fromEntries((catalog || []).map(c => [c.scope + ":" + c.id, c]));
  injectDesignCSS(inst);
  const installedCards = scope => BUILTIN[scope].map(d => ({ ...d, builtin: true })).concat(inst.filter(d => d.scope === scope)).map(d => {
    const key = scope + ":" + d.id, active = cur[scope] === d.id, off = h.has(key) && !active;
    const cat = catById[key], upd = cat && d.version && cat.version !== d.version && !d.builtin;
    return `<div class="card${off ? " off" : ""}">${miniFor(scope, d.id)}
      <div class="foot"><b>${esc(d.name)}</b>${active ? `<span class="tag">Aktiv</span>` : d.builtin ? `<span class="tag">Standard</span>` : ""}
        <label class="sw" title="${active ? "Das aktive Design ist immer sichtbar" : off ? "Ausgeblendet" : "Im Spiel zur Auswahl"}"><input type="checkbox" ${!off ? "checked" : ""} ${active ? "disabled" : ""} onchange="designToggle('${scope}','${esc(d.id)}',this.checked)"><span></span></label></div>
      ${d.builtin ? "" : `<div class="acts2">${upd ? `<button class="b gold" onclick="catalogInstall('${scope}','${esc(d.id)}')">Update ${esc(cat.version)}</button>` : ""}
        <button class="b" onclick="designExport('${scope}','${esc(d.id)}')">Exportieren</button>
        <button class="b danger" onclick="designDelete('${scope}','${esc(d.id)}')" ${active ? "disabled" : ""}>Löschen</button></div>`}
    </div>`; }).join("");
  const missing = (catalog || []).filter(c => !inst.some(d => d.scope === c.scope && d.id === c.id));
  const catCards = missing.map(c => `<div class="card">
      <div class="cat-prev"><div class="cat-badge">${c.scope === "ui" ? "Oberfläche" : "Spieltisch"}</div><b>${esc(c.name)}</b><span>${esc(c.description || "")}</span></div>
      <div class="foot"><b>${esc(c.name)}</b>${c.tag ? `<span class="tag">${esc(c.tag)}</span>` : ""}</div>
      <div class="acts2"><button class="b gold" onclick="catalogInstall('${c.scope}','${esc(c.id)}')">Herunterladen</button></div></div>`).join("");
  return `<div class="bar2"><p>Welche Designs du hast und welche im Spiel zur Auswahl stehen. Gewählt, kombiniert und selbst gebaut wird im Spiel im Design-Studio.</p>
      <button class="b gold" onclick="designImport()">Importieren</button></div>
    <div class="h3">Oberfläche</div><div class="grid">${installedCards("ui")}</div>
    <div class="h3">Spieltisch</div><div class="grid">${installedCards("table")}</div>
    <div class="h3">Katalog · weitere Designs</div>
    ${catalog === null ? `<p class="msg">Katalog wird geladen …</p>` : catalogErr ? `<div class="hint">${esc(catalogErr)}</div>`
      : missing.length ? `<div class="grid">${catCards}</div>` : `<p class="msg">Du hast bereits alle Designs aus dem Katalog.</p>`}`;
}
async function saveDesigns(list) { await saveProfileKeys({ vtt_designs: JSON.stringify(list) }); render(); }
async function designToggle(scope, id, on) {
  const h = hiddenDesigns(); const key = scope + ":" + id;
  if (on) h.delete(key); else h.add(key);
  try { await saveProfileKeys({ vtt_hidden_designs: JSON.stringify([...h]) }); render(); } catch (e) { toast("⚠️ " + e.message); }
}
async function addDesign(raw) {
  const d = (typeof DesignRuntime !== "undefined") ? DesignRuntime.sanitize(raw) : null;
  if (!d) throw new Error("Das ist keine gültige Design-Datei (.vttdesign)");
  const list = designsInstalled().filter(x => !(x.scope === d.scope && x.id === d.id));
  list.push(d); await saveDesigns(list); return d;
}
async function catalogInstall(scope, id) {
  const c = (catalog || []).find(x => x.scope === scope && x.id === id); if (!c) return;
  try { const raw = await getJSON(catalogBase() + c.file, 10000); const d = await addDesign(raw); toast(`„${d.name}" installiert`); }
  catch (e) { toast("⚠️ " + (e.message || "Download fehlgeschlagen")); }
}
async function designExport(scope, id) {
  const d = designsInstalled().find(x => x.scope === scope && x.id === id); if (!d) return;
  const name = (String(d.name || "design").replace(/[^\wäöüÄÖÜß -]+/g, "").trim() || "design") + ".vttdesign";
  await saveFile(name, new TextEncoder().encode(JSON.stringify(d, null, 2)), "application/json");
}
async function designDelete(scope, id) {
  const d = designsInstalled().find(x => x.scope === scope && x.id === id); if (!d) return;
  if (!await askConfirm("Design löschen", `„${d.name}" wird gelöscht.`, "Löschen")) return;
  await saveDesigns(designsInstalled().filter(x => !(x.scope === scope && x.id === id))); toast("Design gelöscht");
}
async function designImport() {
  const f = await pickFile(".vttdesign,.json"); if (!f) return;
  try { const d = await addDesign(JSON.parse(await f.text())); toast(`„${d.name}" importiert`); } catch (e) { toast("⚠️ " + e.message); }
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
$("modal") && $("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

// Übergabe-Paket (nur noch der Rückweg zum Launcher – Profil liegt im Server)
function packHandover(obj) {
  const json = JSON.stringify(obj);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function cmpVer(a, b) {
  const pa = String(a).split(".").map(Number), pb = String(b).split(".").map(Number);
  for (let i = 0; i < 3; i++) { if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0); }
  return 0;
}

// ── Start ─────────────────────────────────────────────────────────────────
(async () => {
  try { if (T && T.app) myVersion = await T.app.getVersion(); } catch (e) {}
  $("ver").textContent = myVersion;
  runUpdate();
})();
</script>

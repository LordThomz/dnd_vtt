<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ══════════════════════════════════════════════════════════════════════════
   WÜRFEL-WERKSTATT – Gestaltung (Logik unten im Skript)
   Links: Würfel · Mitte: Studio-Bühne · Rechts: Einstellungen
   ══════════════════════════════════════════════════════════════════════════ */
html, body { height: 100%; }
body { margin: 0; color: var(--text); font-family: var(--font-ui); background: var(--bg-deep); background-image: var(--backdrop); overflow: hidden; }
.ws { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

/* Kopfzeile */
.ws-top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(var(--panel-rgb), .9), rgba(var(--panel-rgb), .6)); backdrop-filter: blur(8px); position: relative; z-index: 2; }
.ws-back { padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; color: var(--text-dim);
  font: 600 .78rem/1 var(--font-display); letter-spacing: .06em; cursor: pointer; text-decoration: none; }
.ws-back:hover { color: var(--gold-light); border-color: var(--gold-dark); }
.ws-title { font: 700 1.15rem/1 var(--font-display); color: var(--gold-light); letter-spacing: .04em; white-space: nowrap; }
.ws-sep { width: 1px; height: 26px; background: var(--border); }
.set-pick { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.set-pick select, .set-name { padding: 8px 11px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-dark);
  color: var(--text-bright); font: 600 .9rem/1.2 var(--font-ui); }
.set-name { min-width: 120px; max-width: 220px; flex: 0 1 220px; }
.set-name:focus, .set-pick select:focus { outline: none; border-color: var(--arcane); box-shadow: 0 0 0 3px rgba(var(--arcane-rgb), .15); }
.ibtn { width: 36px; height: 36px; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; color: var(--text);
  cursor: pointer; display: grid; place-items: center; flex: 0 0 auto; }
.ibtn:hover:not(:disabled) { color: var(--gold-light); border-color: var(--gold-dark); background: rgba(var(--gold-rgb), .06); }
.ibtn:disabled { opacity: .35; cursor: default; }
.ibtn svg { width: 17px; height: 17px; }
.tbtn { padding: 9px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; color: var(--text);
  font: 700 .74rem/1 var(--font-display); letter-spacing: .06em; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.tbtn:hover { color: var(--gold-light); border-color: var(--gold-dark); }
.tbtn.gold { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: var(--on-accent); border-color: transparent; }
.tbtn.gold:hover { filter: brightness(1.08); color: var(--on-accent); }
.active-pill { font: 600 .7rem/1 var(--font-ui); padding: 5px 9px; border-radius: 20px; color: var(--green-soft);
  background: rgba(var(--green-rgb), .1); border: 1px solid rgba(var(--green-rgb), .35); white-space: nowrap; }

/* Hauptbereich */
.ws-main { display: grid; grid-template-columns: 96px 1fr minmax(360px, 420px); min-height: 0; }

/* Würfel-Leiste */
.rail { display: flex; flex-direction: column; gap: 6px; padding: 14px 10px; border-right: 1px solid var(--border); overflow-y: auto; }
.scope { display: grid; grid-template-columns: 1fr; gap: 4px; margin-bottom: 8px; }
.scope button { padding: 7px 4px; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; color: var(--text-dim);
  font: 600 .64rem/1.2 var(--font-ui); cursor: pointer; }
.scope button.on { color: var(--on-accent); background: var(--gold); border-color: var(--gold); }
.die-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: var(--radius-lg);
  border: 1px solid transparent; background: transparent; color: var(--text-dim); cursor: pointer; }
.die-btn svg { width: 34px; height: 34px; }
.die-btn b { font: 700 .72rem/1 var(--font-display); letter-spacing: .04em; }
.die-btn:hover { color: var(--text-bright); background: rgba(var(--hi-rgb), .04); }
.die-btn.on { color: var(--gold-light); border-color: rgba(var(--gold-rgb), .5); background: rgba(var(--gold-rgb), .08); box-shadow: 0 0 18px rgba(var(--gold-rgb), .12); }

/* Bühne */
.stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; overflow: hidden;
  background: radial-gradient(ellipse 55% 50% at 50% 42%, rgba(var(--gold-rgb), .10), transparent 70%),
              radial-gradient(ellipse 70% 30% at 50% 100%, rgba(var(--arcane-rgb), .07), transparent 70%); }
.stage::before { content: ""; position: absolute; left: 50%; top: 0; width: 560px; height: 100%; transform: translateX(-50%);
  background: linear-gradient(180deg, rgba(var(--hi-rgb), .06), transparent 55%); clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); pointer-events: none; }
.floor { position: absolute; left: 50%; top: calc(50% + 175px); width: 340px; height: 46px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(ellipse, rgba(var(--shade-rgb), .55), transparent 70%); filter: blur(4px); pointer-events: none; }
.stage-canvas { position: relative; width: 460px; height: 460px; }
.stage-info { position: absolute; top: 18px; left: 22px; }
.stage-info b { display: block; font: 700 1.6rem/1 var(--font-display); color: var(--text-bright); }
.stage-info span { font-size: .84rem; color: var(--text-dim); }
.stage-actions { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.hint-drag { position: absolute; top: 22px; right: 22px; font-size: .78rem; color: var(--text-dim); }

/* Einstellungen */
.insp { border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 16px 60px; background: rgba(var(--panel-rgb), .35); }
.sec { border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 10px; background: rgba(var(--hi-rgb), .02); overflow: hidden; }
.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 9px; padding: 13px 14px;
  font: 700 .76rem/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--text-dim); border-bottom: 2px solid var(--text-dim);
  transform: rotate(45deg); transition: transform .2s; }
.sec[open] > summary::after { transform: rotate(225deg); }
.sec > summary svg { width: 16px; height: 16px; }
.sec-body { padding: 2px 14px 14px; }
.sec[open] .sec-body { animation: fx-fade-up .25s ease both; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; }
.row > span { font-size: .88rem; }
.row i { display: block; font-style: normal; font-size: .72rem; color: var(--text-dim); }
.lbl { font: 700 .66rem/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); margin: 12px 0 7px; }

/* Stil-Galerie */
.styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.style-card { padding: 6px 6px 8px; border-radius: var(--radius); border: 1px solid var(--border); background: rgba(var(--hi-rgb), .02); cursor: pointer; text-align: center; color: inherit; }
.style-card:hover { border-color: rgba(var(--gold-rgb), .55); transform: translateY(-1px); }
.style-card img, .style-card .ph { width: 100%; aspect-ratio: 1; border-radius: 8px; display: block; object-fit: contain;
  background: radial-gradient(circle at 50% 40%, rgba(var(--hi-rgb), .06), transparent 70%); }
.style-card b { display: block; font: 700 .7rem/1.2 var(--font-display); color: var(--text-bright); margin-top: 5px; }
.style-card small { font-size: .62rem; color: var(--text-dim); }

/* Material */
.mats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.mat { padding: 8px 2px 7px; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--text-dim);
  display: flex; flex-direction: column; align-items: center; gap: 6px; font: 600 .62rem/1.1 var(--font-ui); }
.mat:hover { color: var(--text-bright); border-color: rgba(var(--gold-rgb), .45); }
.mat.on { color: var(--gold-light); border-color: var(--gold); background: rgba(var(--gold-rgb), .08); }
.orb { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset -4px -5px 10px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.4); }
.orb.plastic { background: radial-gradient(circle at 35% 30%, #fff8 0 8%, #d4b578 30%, #8a6d35 100%); }
.orb.metal { background: conic-gradient(from 200deg, #6d6f78, #e8eaf0, #8a8c96, #f4f6fa, #6d6f78); }
.orb.glass { background: radial-gradient(circle at 35% 30%, #fff 0 6%, #a8d8e855 35%, #1a3a4a88 100%); border: 1px solid #a8d8e866; }
.orb.crystal { background: conic-gradient(from 30deg, #9ad8ff, #c9a6ff, #8af0d0, #ffd9a6, #9ad8ff); opacity: .85; }
.orb.stone { background: radial-gradient(circle at 35% 30%, #8a8a90, #3a3a40 70%), repeating-radial-gradient(circle, #0002 0 1px, transparent 1px 3px); }
.orb.marble { background: linear-gradient(130deg, #f2f0ea 30%, #2a2a30 32%, #f2f0ea 36%, #e0ddd5 60%, #4a4a50 62%, #f2f0ea 66%); }
.orb.wood { background: repeating-linear-gradient(100deg, #a06838 0 4px, #7a4a22 4px 6px, #b07848 6px 10px); }
.orb.pearl { background: radial-gradient(circle at 35% 30%, #fff 0 10%, #f2ece4 30%, #d9cdea 60%, #c8e6e0 100%); }
.orb.holo { background: conic-gradient(from 0deg, #ff7ad9, #7ad9ff, #b6ff7a, #ffe07a, #ff7ad9); }
.orb.obsidian { background: radial-gradient(circle at 35% 28%, #fff9 0 6%, #2a2430 25%, #050407 80%); }

/* Farben */
.palettes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pal { height: 34px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; display: flex; overflow: hidden; padding: 0; }
.pal i { flex: 1; } .pal i:last-child { flex: .5; }
.pal:hover { transform: translateY(-1px); border-color: var(--gold); }
.crow { display: flex; align-items: center; gap: 8px; }
.crow input[type=color] { width: 40px; height: 30px; padding: 0; border: 1px solid var(--border); border-radius: 8px; background: none; cursor: pointer; }
.crow input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; } .crow input[type=color]::-webkit-color-swatch { border: none; border-radius: 6px; }
.crow code { font: 500 .72rem/1 var(--font-mono); color: var(--text-dim); width: 62px; }
.xbtn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; font-size: .7rem; }
.xbtn:hover { color: var(--red-soft); border-color: var(--red); }

/* Muster & Schriften */
.patterns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.pat { border-radius: var(--radius); border: 1px solid var(--border); background: transparent; cursor: pointer; padding: 4px; color: var(--text-dim); font: 600 .6rem/1.1 var(--font-ui); }
.pat img { width: 100%; aspect-ratio: 1; border-radius: 6px; display: block; margin-bottom: 4px; }
.pat:hover { border-color: rgba(var(--gold-rgb), .45); color: var(--text-bright); }
.pat.on { border-color: var(--gold); color: var(--gold-light); box-shadow: 0 0 0 1px var(--gold); }
.fonts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.font { padding: 8px 2px 6px; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--text-bright); }
.font b { display: block; font-size: 1.4rem; line-height: 1.1; font-weight: 700; }
.font small { font: 500 .58rem/1 var(--font-ui); color: var(--text-dim); }
.font.on { border-color: var(--gold); background: rgba(var(--gold-rgb), .08); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.seg button { padding: 7px 11px; border: none; background: transparent; color: var(--text-dim); font: 600 .72rem/1 var(--font-ui); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: rgba(var(--gold-rgb), .16); color: var(--gold-light); }
input[type=range] { accent-color: var(--gold); width: 150px; }

/* Neues-Set-Fenster */
.ns-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }

@media (max-width: 1100px) { .ws-main { grid-template-columns: 80px 1fr 340px; } .stage-canvas { width: 360px; height: 360px; } .floor { top: calc(50% + 135px); } }
</style>
</head>
<body>
<div class="ws">
  <header class="ws-top">
    <a class="ws-back" href="/menu">← Menü</a>
    <div class="ws-title">Würfel-Werkstatt</div>
    <div class="ws-sep"></div>
    <div class="set-pick">
      <select id="set-select" title="Set wechseln" onchange="loadSet(this.value)"></select>
      <input class="set-name" id="set-name" maxlength="40" title="Set umbenennen" onchange="renameSet(this.value)">
      <span class="active-pill" id="active-pill">Aktiv beim Würfeln</span>
    </div>
    <button class="ibtn" id="btn-undo" title="Rückgängig (Strg+Z)" onclick="undo()"></button>
    <button class="ibtn" id="btn-redo" title="Wiederholen (Strg+Y)" onclick="redo()"></button>
    <button class="tbtn" onclick="surprise()" title="Zufälliger, stimmiger Look"><span id="ic-surprise"></span>Überrasch mich</button>
    <button class="tbtn" onclick="duplicateSet()"><span id="ic-dup"></span>Duplizieren</button>
    <button class="tbtn gold" onclick="openNewSet()"><span id="ic-new"></span>Neues Set</button>
  </header>

  <main class="ws-main">
    <aside class="rail">
      <div class="scope" title="Gilt eine Änderung für alle Würfel des Sets oder nur für den gewählten?">
        <button id="scope-all" class="on" onclick="setScope('all')">Alle Würfel</button>
        <button id="scope-one" onclick="setScope('one')">Nur dieser</button>
      </div>
      <div id="die-rail"></div>
    </aside>

    <section class="stage">
      <div class="stage-info"><b id="stage-die">W20</b><span id="stage-sub"></span></div>
      <div class="hint-drag">Ziehen zum Drehen</div>
      <div class="floor"></div>
      <canvas id="preview-canvas" class="stage-canvas" style="width:460px;height:460px"></canvas>
      <div class="stage-actions">
        <button class="tbtn gold" onclick="Dice3D.testRoll(current)"><span id="ic-roll"></span>Testwurf</button>
        <button class="tbtn" onclick="rollSet()"><span id="ic-rollall"></span>Ganzes Set würfeln</button>
        <button class="tbtn" onclick="testSound()"><span id="ic-sound"></span>Klang</button>
      </div>
    </section>

    <aside class="insp" id="insp"></aside>
  </main>
</div>

<script src="/static/lib/three.min.js"></script>
<script src="/static/lib/cannon-es.min.js"></script>
<script src="/static/lib/RoomEnvironment.js"></script>
<script src="/static/js/dialog.js"></script>
<script src="/static/js/dice-geometry.js"></script>
<script src="/static/js/dice-material.js"></script>
<script src="/static/js/dice-sound.js"></script>
<script src="/static/js/dice-presets.js"></script>
<script src="/static/js/dice3d.js"></script>
<script src="/static/js/icons.js"></script>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   WÜRFEL-WERKSTATT – Logik
   • Ein Set = 7 Würfel (W4 … W100), jeder mit eigenem Aussehen.
   • „Alle Würfel": Änderungen gelten für das ganze Set, „Nur dieser": nur
     für den gewählten Würfel.
   • Stil = Startpunkt (Vorlagen aus dice-presets.js), alles darunter
     verfeinert ihn – es gibt keine zweite Stelle für Würfel-Looks.
   • Rückgängig/Wiederholen, Vorschaubild je Set (Dice3D.snapshot).
   • Löschen und Teilen von Sets: im Launcher (eine Stelle).
   ══════════════════════════════════════════════════════════════════════════ */
const SIDES = [4, 6, 8, 10, 12, 20, 100];
const FONTS = [
  { id: "'Cinzel', Georgia, serif",                    label: "Fantasy" },
  { id: "'Cinzel Decorative', 'Cinzel', serif",         label: "Zier" },
  { id: "'Uncial Antiqua', Georgia, serif",             label: "Altertum" },
  { id: "'Crimson Pro', Georgia, serif",                label: "Klassisch" },
  { id: "'Orbitron', sans-serif",                       label: "Futur" },
  { id: "'JetBrains Mono', monospace",                  label: "Technisch" },
  { id: "'Segoe UI', system-ui, sans-serif",            label: "Klar" },
  { id: "Georgia, serif",                               label: "Buch" },
];
// Abgestimmte Farbpaletten: Körper, Zweitfarbe, Zahlen
const PALETTES = [
  { n: "Königsgold", c: ["#c8a24a", null, "#1b1407"] },   { n: "Mitternacht", c: ["#141a33", "#3a2a6a", "#e8c46a"] },
  { n: "Blutmond", c: ["#5a0f12", "#1a0405", "#f1dcc0"] }, { n: "Smaragd", c: ["#0f5a3f", "#0a2a20", "#e9f5d0"] },
  { n: "Gletscher", c: ["#bfe6ff", "#ffffff", "#12324f"] }, { n: "Neon", c: ["#0a0f1a", "#1a0a2a", "#2fe3ff"] },
  { n: "Synthwave", c: ["#2a0a3a", "#ff3ea5", "#fff3a0"] }, { n: "Elfenbein", c: ["#efe4c8", null, "#2a1a0a"] },
  { n: "Kupfer", c: ["#b0613a", "#5a2a14", "#fff0dc"] },    { n: "Schiefer", c: ["#3a4048", "#1e2328", "#e8eef4"] },
];
const DIE_SVG = {
  4:   '<polygon points="12,3 21,20 3,20" />',
  6:   '<rect x="4" y="4" width="16" height="16" rx="2" />',
  8:   '<polygon points="12,2 21,12 12,22 3,12" /><line x1="3" y1="12" x2="21" y2="12" />',
  10:  '<polygon points="12,2 21,10 12,22 3,10" /><polyline points="3,10 12,13 21,10" /><line x1="12" y1="13" x2="12" y2="22" />',
  12:  '<polygon points="12,2 21,8.5 18,20 6,20 3,8.5" /><polygon points="12,7 16,10 14.5,15 9.5,15 8,10" />',
  20:  '<polygon points="12,2 21,7 21,17 12,22 3,17 3,7" /><polygon points="12,6 17,15 7,15" />',
  100: '<polygon points="12,2 21,10 12,22 3,10" /><text x="12" y="15" text-anchor="middle" font-size="6" stroke="none" fill="currentColor">%</text>',
};
const dieSvg = s => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">${DIE_SVG[s]}</svg>`;
// DicePresets ist eine globale const (kein window-Eintrag) → so abfragen
const presetList = () => (typeof DicePresets !== "undefined" ? DicePresets : []);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ic = n => (typeof Icons !== "undefined" ? Icons.svg(n) : "");

let current = 20, scope = "all", set = null, history = [], future = [];
const canvas = document.getElementById("preview-canvas");
const styleOf = sides => Object.assign({}, Dice3D.DEFAULT_DIE_STYLE, (set.dice || {})[sides] || {});

// ── Laden, Speichern, Verlauf ───────────────────────────────────────────────
function loadSet(id) {
  const all = Dice3D.getSets();
  const s = all.find(x => x.id === id) || Dice3D.getActiveSet();
  set = JSON.parse(JSON.stringify(s));
  SIDES.forEach(sd => { set.dice[sd] = Object.assign({}, Dice3D.DEFAULT_DIE_STYLE, set.dice[sd] || set.dice[20] || {}); });
  Dice3D.setActiveSet(set.id);           // die Werkstatt zeigt immer das Set, mit dem gewürfelt wird
  history = []; future = [];
  renderAll();
}
let saveT = 0, thumbT = 0;
function persist() {
  clearTimeout(saveT); saveT = setTimeout(() => Dice3D.saveSet(set), 250);
  clearTimeout(thumbT); thumbT = setTimeout(makeThumb, 1400);
}
async function makeThumb() {
  if (document.documentElement.classList.contains("vtt-veil")) return void Theme.whenReady(makeThumb);
  try { const url = await Dice3D.snapshot(20, set.dice[20], 140); if (url) { set.thumb = url; Dice3D.saveSet(set); renderSetSelect(); } } catch (e) {}
}
function snapshot() { return JSON.stringify(set.dice); }
function apply(patch, opts) {
  history.push(snapshot()); if (history.length > 60) history.shift(); future = [];
  const targets = (opts && opts.all) || scope === "all" ? SIDES : [current];
  targets.forEach(sd => { set.dice[sd] = Object.assign({}, set.dice[sd], patch); });
  persist(); refresh();
}
function undo() { if (!history.length) return; future.push(snapshot()); set.dice = JSON.parse(history.pop()); persist(); refresh(); }
function redo() { if (!future.length) return; history.push(snapshot()); set.dice = JSON.parse(future.pop()); persist(); refresh(); }
document.addEventListener("keydown", e => {
  if (!(e.ctrlKey || e.metaKey) || /input|select|textarea/i.test(e.target.tagName)) return;
  if (e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  if (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey)) { e.preventDefault(); redo(); }
});

// ── Sets ────────────────────────────────────────────────────────────────────
function renderSetSelect() {
  const sel = document.getElementById("set-select");
  sel.innerHTML = Dice3D.getVisibleSets().map(s => `<option value="${esc(s.id)}" ${s.id === set.id ? "selected" : ""}>${esc(s.name || "Set")}</option>`).join("");
  document.getElementById("set-name").value = set.name || "";
}
function renameSet(name) { set.name = (name || "").trim().slice(0, 40) || "Mein Set"; Dice3D.saveSet(set); renderSetSelect(); }
function duplicateSet() {
  const c = JSON.parse(JSON.stringify(set)); c.id = "set_" + Date.now().toString(36); c.name = (set.name || "Set") + " (Kopie)";
  delete c.presetId; delete c.hidden; Dice3D.saveSet(c); loadSet(c.id);
  if (typeof UI !== "undefined") UI.toast("Set dupliziert");
}
function openNewSet() {
  const list = presetList();
  const el = document.getElementById("ns") || Object.assign(document.createElement("div"), { id: "ns", className: "ds-backdrop" });
  el.innerHTML = `<div class="ds-win" style="width:min(860px,94vw)"><header class="ds-head"><div><h2>Neues Würfel-Set</h2>
    <span>Wähle einen Stil als Startpunkt – danach passt du alles frei an.</span></div><button class="ds-x">✕</button></header>
    <div class="ds-body"><div class="ns-grid">
      <button class="style-card" data-new=""><div class="ph" style="display:grid;place-items:center;font-size:2rem;color:var(--gold)">＋</div><b>Leer</b><small>Standard</small></button>
      ${list.map(p => `<button class="style-card" data-new="${p.id}"><img data-thumb="${p.id}" alt=""><b>${esc(p.name)}</b><small>${esc(p.tag || "")}</small></button>`).join("")}
    </div></div></div>`;
  document.body.appendChild(el);
  fillPresetThumbs(el);
  el.onclick = e => {
    if (e.target === el || e.target.closest(".ds-x")) return el.classList.remove("open");
    const b = e.target.closest("[data-new]"); if (!b) return;
    let s;
    if (b.dataset.new) {
      const p = list.find(x => x.id === b.dataset.new);
      s = Dice3D.newSet(p.name); SIDES.forEach(sd => { s.dice[sd] = Object.assign({}, Dice3D.DEFAULT_DIE_STYLE, p.style); });
    } else s = Dice3D.newSet("Neues Set");
    Dice3D.saveSet(s); el.classList.remove("open"); loadSet(s.id);
  };
  requestAnimationFrame(() => el.classList.add("open"));
}
function rollSet() { Dice3D.roll([4, 6, 8, 10, 12, 20].map(s => ({ sides: s })), { label: set.name || "Probewurf" }); }
function testSound() {
  try { const surf = (DiceMaterial.SURFACES[styleOf(current).surface] || {}).sound || "plastic"; DiceSound.impact(surf, .8); setTimeout(() => DiceSound.impact(surf, .45), 180); } catch (e) {}
}

// ── Überrasch mich: Stil + Palette + Muster stimmig kombinieren ─────────────
function surprise() {
  const P = presetList(), pick = a => a[Math.floor(Math.random() * a.length)];
  const base = Object.assign({}, pick(P).style);
  if (Math.random() < .55) { const pal = pick(PALETTES).c; base.color = pal[0]; base.color2 = pal[1]; base.numberColor = pal[2]; }
  if (Math.random() < .4) base.pattern = pick(Object.keys(DiceMaterial.PATTERNS));
  if (Math.random() < .35) base.edges = pick(["subtle", "bold"]);
  apply(Object.assign({}, Dice3D.DEFAULT_DIE_STYLE, base), { all: true });
}

// ── Vorschau-Bilder für Stile und Muster ───────────────────────────────────
// Stil-Vorschauen: einmal erzeugen und DAUERHAFT merken (je Stil + Aussehen).
// Sie entstehen erst, wenn die Seite fertig ist, eins nach dem anderen mit
// Pausen – so ruckelt beim Öffnen der Werkstatt nichts.
const THUMB_KEY = "vtt_style_thumbs_v1";
const _thumbCache = (() => { try { return JSON.parse(localStorage.getItem(THUMB_KEY) || "{}"); } catch (e) { return {}; } })();
const _thumbId = p => p.id + ":" + JSON.stringify(p.style).length + ":" + (JSON.stringify(p.style).split("").reduce((a, c) => (a * 31 + c.charCodeAt(0)) | 0, 7));
let _thumbRun = null;
function fillPresetThumbs(root) {
  // Vorhandene sofort einsetzen …
  root.querySelectorAll("img[data-thumb]").forEach(img => {
    const p = presetList().find(x => x.id === img.dataset.thumb);
    if (p && _thumbCache[_thumbId(p)]) img.src = _thumbCache[_thumbId(p)];
  });
  // … fehlende nach dem Laden nacheinander erzeugen
  if (_thumbRun) return;
  _thumbRun = new Promise(done => Theme.whenReady(async () => {
    for (const p of presetList()) {
      const id = _thumbId(p);
      if (!_thumbCache[id]) {
        _thumbCache[id] = await Dice3D.snapshot(20, p.style, 120);
        try { localStorage.setItem(THUMB_KEY, JSON.stringify(_thumbCache)); } catch (e) {}
        document.querySelectorAll(`img[data-thumb="${p.id}"]`).forEach(img => { img.src = _thumbCache[id] || ""; });
        await new Promise(r => setTimeout(r, 140));          // Luft für die Animation
      }
    }
    _thumbRun = null; done();
  }));
}
// ── Darstellung ─────────────────────────────────────────────────────────────
function renderRail() {
  document.getElementById("die-rail").innerHTML = SIDES.map(s =>
    `<button class="die-btn${s === current ? " on" : ""}" onclick="pickDie(${s})" title="W${s}">${dieSvg(s)}<b>W${s}</b></button>`).join("");
}
function pickDie(s) { current = s; renderRail(); refresh(); }
function setScope(v) {
  scope = v;
  document.getElementById("scope-all").classList.toggle("on", v === "all");
  document.getElementById("scope-one").classList.toggle("on", v === "one");
  refreshStageInfo();
}
function refreshStageInfo() {
  document.getElementById("stage-die").textContent = "W" + current;
  const st = styleOf(current), surf = DiceMaterial.SURFACES[st.surface] || {};
  document.getElementById("stage-sub").textContent = (surf.label || "") + (scope === "all" ? " · Änderungen für alle Würfel" : " · Änderungen nur für diesen Würfel");
}
let prevT = 0;
function refresh() {
  refreshStageInfo();
  clearTimeout(prevT); prevT = setTimeout(() => Dice3D.preview(current, styleOf(current), canvas), 40);
  renderInspector();
  document.getElementById("btn-undo").disabled = !history.length;
  document.getElementById("btn-redo").disabled = !future.length;
}
function renderAll() { renderSetSelect(); renderRail(); refresh(); }

// Einstellungen rechts. Geöffnete Abschnitte bleiben beim Neuzeichnen offen.
const openSecs = new Set(["style", "material", "colors"]);
function sec(id, icon, title, body) {
  return `<details class="sec" data-sec="${id}" ${openSecs.has(id) ? "open" : ""}><summary>${ic(icon)}${title}</summary><div class="sec-body">${body}</div></details>`;
}
function colorRow(key, label, hint, removable) {
  const v = styleOf(current)[key];
  return `<div class="row"><span>${label}${hint ? `<i>${hint}</i>` : ""}</span><div class="crow">
    <input type="color" value="${esc(v || "#888888")}" oninput="liveColor('${key}', this.value)" onchange="apply({${key}: this.value})"><code>${v ? esc(v) : "–"}</code>
    ${removable && v ? `<button class="xbtn" title="Entfernen" onclick="apply({${key}: null})">✕</button>` : ""}</div></div>`;
}
let liveT = 0;
function liveColor(key, v) {           // Farbe beim Ziehen sofort zeigen, Verlauf erst beim Loslassen
  clearTimeout(liveT);
  liveT = setTimeout(() => { const st = Object.assign(styleOf(current), { [key]: v }); Dice3D.preview(current, st, canvas); }, 60);
}
function seg(key, opts) {
  const v = styleOf(current)[key];
  return `<div class="seg">${opts.map(([val, label]) => `<button class="${String(v) === String(val) ? "on" : ""}" onclick='apply(${JSON.stringify({ [key]: val })})'>${label}</button>`).join("")}</div>`;
}
function range(key, min, max, step, scale) {
  const v = styleOf(current)[key] ?? 0;
  return `<input type="range" min="${min}" max="${max}" step="${step}" value="${v * (scale || 1)}" onchange="apply({${key}: this.value / ${scale || 1}})">`;
}
function renderInspector() {
  const st = styleOf(current), S = DiceMaterial.SURFACES, PT = DiceMaterial.PATTERNS;
  const presets = presetList();
  const html =
    sec("style", "sparkles", "Stil",
      `<div class="styles">${presets.map(p => `<button class="style-card" title="${esc(p.tag || "")}" onclick="applyPreset('${p.id}')"><img data-thumb="${p.id}" alt=""><b>${esc(p.name)}</b></button>`).join("")}</div>
       <div class="lbl" style="margin-top:10px">Ein Stil ist der Startpunkt – darunter verfeinerst du ihn.</div>`) +
    sec("material", "gem", "Material",
      `<div class="mats">${Object.entries(S).map(([id, m]) => `<button class="mat${st.surface === id ? " on" : ""}" onclick="pickSurface('${id}')"><span class="orb ${id}"></span>${esc(m.label)}</button>`).join("")}</div>`) +
    sec("colors", "palette", "Farben",
      `<div class="lbl">Abgestimmte Paletten</div><div class="palettes">${PALETTES.map((p, i) =>
        `<button class="pal" title="${esc(p.n)}" onclick="pickPalette(${i})"><i style="background:${p.c[0]}"></i><i style="background:${p.c[1] || p.c[0]}"></i><i style="background:${p.c[2]}"></i></button>`).join("")}</div>
       <div class="lbl">Einzeln</div>${colorRow("color", "Körper")}${colorRow("color2", "Zweitfarbe", "Verlauf", true)}${colorRow("numberColor", "Zahlen", "leer = automatisch", true)}${colorRow("accentColor", "Muster-Akzent")}`) +
    sec("pattern", "sparkle", "Muster",
      `<div class="patterns">${Object.entries(PT).map(([id, p]) => `<button class="pat${(st.pattern || "none") === id ? " on" : ""}" onclick="apply({pattern:'${id}'})"><img data-pat="${id}" alt="">${esc(p.label)}</button>`).join("")}</div>`) +
    sec("numbers", "type", "Zahlen",
      `<div class="fonts">${FONTS.map(f => `<button class="font${st.font === f.id ? " on" : ""}" onclick="apply({font:${JSON.stringify(f.id).replace(/"/g, "&quot;")}})"><b style="font-family:${esc(f.id)}">20</b><small>${esc(f.label)}</small></button>`).join("")}</div>
       <div class="row"><span>Größe</span>${range("numberScale", 60, 140, 5, 100)}</div>
       <div class="row"><span>Umrandung</span>${range("numberOutline", 0, 20, 1, 100)}</div>
       ${colorRow("outlineColor", "Farbe der Umrandung", "", true)}
       <div class="row"><span>Leuchten<i>Zahlen glühen von innen</i></span>${range("numberGlow", 0, 100, 5, 100)}</div>`) +
    sec("edges", "hexagon", "Kanten & Rahmen",
      `<div class="row"><span>Kanten<i>abgerundete Kanten färben</i></span>${seg("edges", [["none", "Körper"], ["subtle", "Dezent"], ["bold", "Kräftig"]])}</div>
       ${st.edges && st.edges !== "none" ? colorRow("edgeColor", "Kantenfarbe") : ""}
       <div class="row"><span>Rahmen auf den Flächen</span>${seg("border", [["none", "Keiner"], ["solid", "Linie"], ["glow", "Leuchtend"], ["dashed", "Gestrichelt"]])}</div>
       ${st.border && st.border !== "none" ? colorRow("borderColor", "Rahmenfarbe") + `<div class="row"><span>Stärke</span>${range("borderWidth", 2, 16, 1, 1)}</div>` : ""}`) +
    sec("sound", "volume-2", "Klang",
      `<div class="row"><span>Würfel-Geräusche</span><input type="checkbox" ${DiceSound.isEnabled() ? "checked" : ""} onchange="DiceSound.setEnabled(this.checked)" style="width:18px;height:18px;accent-color:var(--gold)"></div>
       <div class="row"><span>Lautstärke</span><input type="range" min="0" max="100" value="${Math.round(DiceSound.getVolume() * 100)}" oninput="DiceSound.setVolume(this.value/100)"></div>
       <div class="lbl">Der Klang richtet sich nach dem Material.</div>`);
  const insp = document.getElementById("insp"), y = insp.scrollTop;
  // Die Stil-Galerie ändert sich nie – sie bleibt stehen, statt bei jeder
  // Änderung 14 Vorschaubilder neu einzusetzen (das ruckelte).
  const keepStyles = insp.querySelector('details[data-sec="style"]');
  insp.innerHTML = html;
  const fresh = insp.querySelector('details[data-sec="style"]');
  if (keepStyles && fresh) fresh.replaceWith(keepStyles);
  insp.scrollTop = y;
  insp.querySelectorAll("details.sec").forEach(d => {
    if (d.dataset.bound) return; d.dataset.bound = "1";
    d.addEventListener("toggle", () => {
      d.open ? openSecs.add(d.dataset.sec) : openSecs.delete(d.dataset.sec);
      if (d.open) { fillPresetThumbs(d); fillPatternThumbs(d); }
    });
  });
  if (!keepStyles) fillPresetThumbs(insp);
  fillPatternThumbs(insp);
}
const _patCache = {};
function fillPatternThumbs(root) {
  const st = styleOf(current);
  root.querySelectorAll("img[data-pat]").forEach(img => {
    const key = img.dataset.pat + "|" + st.color + "|" + st.accentColor;
    img.src = _patCache[key] || (_patCache[key] = DiceMaterial.patternPreview(img.dataset.pat, st.color, st.accentColor, 72));
  });
}
function applyPreset(id) {
  const p = presetList().find(x => x.id === id); if (!p) return;
  apply(Object.assign({}, Dice3D.DEFAULT_DIE_STYLE, p.style));
}
function pickSurface(id) {
  const m = DiceMaterial.SURFACES[id] || {};
  // passende Grundfarben der Oberfläche übernehmen (bleiben danach frei änderbar)
  const patch = { surface: id };
  if (m.defaultColor) patch.color = m.defaultColor;
  if (m.defaultNumber) patch.numberColor = m.defaultNumber;
  patch.color2 = m.defaultColor2 || null;
  apply(patch);
}
function pickPalette(i) { const c = PALETTES[i].c; apply({ color: c[0], color2: c[1], numberColor: c[2] }); }

document.getElementById("ic-rollall").innerHTML = ic("dices");

  try { Theme.hold(Dice3D.preview(current, styleOf(current), canvas)); } catch (e) {}
